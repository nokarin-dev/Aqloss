[package]
name = "aqloss_rust_core"
version = "0.4.0"
edition = "2021"

[lib]
name = "aqloss_rust_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# Audio decoding
symphonia = { version = "0.6", features = ["all"] }

# Audio output (cross-platform)
cpal = "0.17"

# High-quality resampling
rubato = "2"

# Metadata & tag parsing
lofty = "0.24"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"

walkdir = "2"
discord-presence = "3.2.0"
ringbuf = "0.4.8"
biquad = "0.6.0"
image = "0.25.10"
lru = "0.18.0"
realfft = "3.5.0"

# Lua scripting engine
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }

# Blocking HTTP for plugins
ureq = { version = "3.3.0", features = ["json"] }

# Zip for .aqx extraction
zip = "2"

# JSON serializations for plugin
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
]}

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
