name: aqloss_installer
description: "Aqloss standalone installer for Windows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  path_provider: ^2.1.3
  path: ^1.9.0
  archive: ^4.0.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/icons/
    - assets/aqloss_bundle.zip
