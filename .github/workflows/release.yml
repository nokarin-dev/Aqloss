name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate tag & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches version.yaml
        run: bash .github/scripts/assert-release-version.sh

  build-linux:
    name: Linux
    needs: [validate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version
        id: version
      - uses: ./.github/actions/setup-aqloss
        with:
          install-linux-deps: "true"
      - run: flutter build linux --release
      - run: |
          bash .github/scripts/package-deb.sh "${{ steps.version.outputs.version }}"
          bash .github/scripts/package-appimage.sh
          bash .github/scripts/package-portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Aqloss-linux-installer.deb
            Aqloss-linux.AppImage
            Aqloss-linux-portable.tar.gz

  build-linux-rpm:
    name: Linux (RPM)
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    env:
      GIT_CONFIG_GLOBAL: /root/.gitconfig-ci
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/read-version
        id: version
      - run: |
          dnf install -y @development-tools clang cmake ninja-build pkg-config \
            gtk3-devel xz-devel libstdc++-devel alsa-lib-devel pulseaudio-libs-devel \
            rpm-build desktop-file-utils hicolor-icon-theme which curl unzip git
      - uses: ./.github/actions/setup-aqloss
      - run: flutter build linux --release
      - run: bash .github/scripts/package-rpm.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: Aqloss-linux-installer.rpm

  build-windows:
    name: Windows
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version
        id: version
      - uses: ./.github/actions/setup-aqloss
      - run: flutter build windows --release
      - shell: pwsh
        run: .\.github\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Aqloss-windows-installer.exe
            Aqloss-windows-portable.zip

  build-android:
    name: Android
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/read-version
        id: version
      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build APKs (debug certificate, not Play Store-signed)
        run: flutter build apk --release --split-per-abi
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   Aqloss-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Aqloss-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      Aqloss-android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Aqloss-android-arm64.apk
            Aqloss-android-arm32.apk
            Aqloss-android-x86_64.apk

  build-macos:
    name: macOS
    needs: [validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for xcode in /Applications/Xcode_26.1.app /Applications/Xcode_16.4.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: flutter build macos --release
      - name: Package DMG and zip (unsigned)
        run: |
          APP="build/macos/Build/Products/Release/Aqloss.app"
          [ -d "$APP" ] || { echo "Missing $APP"; find build/macos -name '*.app' | head -20; exit 1; }
          hdiutil create -volname "Aqloss" -srcfolder "$APP" -ov -format UDZO "Aqloss-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Aqloss-macos-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Aqloss-macos.dmg
            Aqloss-macos-portable.zip

  build-ios:
    name: iOS
    needs: [validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for xcode in /Applications/Xcode_26.1.app /Applications/Xcode_16.4.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
      - run: xcodebuild -downloadPlatform iOS
      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: flutter build ios --release --no-codesign
      - name: Package IPA (unsigned)
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || { echo "Missing $APP_PATH"; find build/ios -name '*.app' | head -20; exit 1; }
          mkdir -p Payload && cp -r "$APP_PATH" Payload/
          zip -qr Aqloss-ios.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Aqloss-ios.ipa

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - build-linux
      - build-linux-rpm
      - build-windows
      - build-android
      - build-macos
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert tag matches version.yaml
        run: bash .github/scripts/assert-release-version.sh

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_BARE="${VERSION#v}"
          SECTION=$(awk \
            "/^## \\[${VERSION_BARE}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" \
            changelog.md 2>/dev/null || true)
          if [ -z "$SECTION" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
            if [ -z "$PREV_TAG" ]; then
              SECTION=$(git log --oneline --no-decorate | head -20)
            else
              SECTION=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
            fi
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          name: Aqloss ${{ github.ref_name }}
          body: |
            ${{ env.CHANGELOG }}

            ---

            ## Downloads

            | Platform | Installer | Portable |
            | --- | --- | --- |
            | Windows | [Installer](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-windows-installer.exe) | [Portable](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-windows-portable.zip) |
            | Linux | [.deb](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-linux-installer.deb) · [.rpm](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-linux-installer.rpm) · [AppImage](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-linux.AppImage) | [tar.gz](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-linux-portable.tar.gz) |
            | Android | [arm64](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-android-arm64.apk) · [arm32](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-android-arm32.apk) · [x86_64](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-android-x86_64.apk) | sideload only |
            | macOS | [DMG](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-macos.dmg) (unsigned) | [zip](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-macos-portable.zip) |
            | iOS | [IPA](https://github.com/nokarin-dev/aqloss/releases/download/${{ github.ref_name }}/Aqloss-ios.ipa) (unsigned) | sideload only |

            > **Note:** Mobile builds are not signed for App Store, Play Store, or notarization. Android APKs use the debug certificate; macOS and iOS require manual/sideload install. Desktop builds (Windows, Linux) are the primary distribution channel.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/Aqloss-windows-installer.exe
            dist/Aqloss-windows-portable.zip
            dist/Aqloss-linux-installer.deb
            dist/Aqloss-linux-installer.rpm
            dist/Aqloss-linux.AppImage
            dist/Aqloss-linux-portable.tar.gz
            dist/Aqloss-android-arm64.apk
            dist/Aqloss-android-arm32.apk
            dist/Aqloss-android-x86_64.apk
            dist/Aqloss-macos.dmg
            dist/Aqloss-macos-portable.zip
            dist/Aqloss-ios.ipa
          token: ${{ secrets.GH_TOKEN }}
