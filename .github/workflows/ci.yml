name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-aqloss

      - name: Dart analyze
        run: flutter analyze --no-fatal-infos

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-aqloss
        with:
          install-linux-audio-deps: "true"

      - name: cargo check
        working-directory: rust
        run: cargo check --release

  build-linux:
    name: Linux
    needs: [quality, rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/read-version
        id: version

      - uses: ./.github/actions/setup-aqloss
        with:
          install-linux-deps: "true"

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package .deb, AppImage, portable
        run: |
          bash .github/scripts/package-deb.sh "${{ steps.version.outputs.version }}"
          bash .github/scripts/package-appimage.sh
          bash .github/scripts/package-portable.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 7
          if-no-files-found: error
          path: |
            Aqloss-linux-installer.deb
            Aqloss-linux.AppImage
            Aqloss-linux-portable.tar.gz

  build-linux-rpm:
    name: Linux (RPM)
    needs: [quality, rust]
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    env:
      GIT_CONFIG_GLOBAL: /root/.gitconfig-ci
    steps:
      # Bare fedora images have no git; checkout/config need it first.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: bash .github/scripts/git-safe-directory.sh

      - uses: ./.github/actions/read-version
        id: version

      - name: Install build dependencies
        run: bash .github/scripts/fedora-rpm-deps.sh

      - uses: ./.github/actions/setup-aqloss
        with:
          install-linux-deps: "false"

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package RPM
        run: bash .github/scripts/package-rpm.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          retention-days: 7
          if-no-files-found: error
          path: Aqloss-linux-installer.rpm

  build-windows:
    name: Windows
    needs: [quality, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/read-version
        id: version

      - uses: ./.github/actions/setup-aqloss

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package installer and portable
        shell: pwsh
        run: |
          .\.github\scripts\package-windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 7
          if-no-files-found: error
          path: |
            Aqloss-windows-installer.exe
            Aqloss-windows-portable.zip

  build-android:
    name: Android
    needs: [quality, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APK artifacts
        run: |
          set -euo pipefail
          for src_dst in \
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk:Aqloss-android-arm64.apk" \
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk:Aqloss-android-arm32.apk" \
            "build/app/outputs/flutter-apk/app-x86_64-release.apk:Aqloss-android-x86_64.apk"
          do
            src="${src_dst%%:*}"
            dst="${src_dst##*:}"
            [ -f "$src" ] || { echo "Missing APK: $src"; ls -la build/app/outputs/flutter-apk || true; exit 1; }
            cp "$src" "$dst"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 7
          if-no-files-found: error
          path: |
            Aqloss-android-arm64.apk
            Aqloss-android-arm32.apk
            Aqloss-android-x86_64.apk

  build-macos:
    name: macOS
    needs: [quality, rust]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for xcode in /Applications/Xcode_26.1.app /Applications/Xcode_16.4.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              break
            fi
          done

      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG and portable zip
        run: |
          APP="build/macos/Build/Products/Release/Aqloss.app"
          [ -d "$APP" ] || { echo "Missing $APP"; find build/macos -name '*.app' | head -20; exit 1; }
          hdiutil create -volname "Aqloss" -srcfolder "$APP" -ov -format UDZO "Aqloss-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Aqloss-macos-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          retention-days: 7
          if-no-files-found: error
          path: |
            Aqloss-macos.dmg
            Aqloss-macos-portable.zip

  build-ios:
    name: iOS
    needs: [quality, rust]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for xcode in /Applications/Xcode_26.1.app /Applications/Xcode_16.4.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              break
            fi
          done

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - uses: ./.github/actions/setup-aqloss
        with:
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || { echo "Missing $APP_PATH"; find build/ios -name '*.app' | head -20; exit 1; }
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Aqloss-ios.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          retention-days: 7
          if-no-files-found: error
          path: Aqloss-ios.ipa

  ci-ok:
    name: CI passed
    if: always()
    needs:
      - quality
      - rust
      - build-linux
      - build-linux-rpm
      - build-windows
      - build-android
      - build-macos
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "Required job '$name' did not succeed (result=$result)"
              exit 1
            fi
          }
          check quality "${{ needs.quality.result }}"
          check rust "${{ needs.rust.result }}"
          check build-linux "${{ needs.build-linux.result }}"
          check build-linux-rpm "${{ needs.build-linux-rpm.result }}"
          check build-windows "${{ needs.build-windows.result }}"
          check build-android "${{ needs.build-android.result }}"
          check build-macos "${{ needs.build-macos.result }}"
          check build-ios "${{ needs.build-ios.result }}"
