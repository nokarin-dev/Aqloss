name: aqloss
description: "Aqloss is a cross-platform music player engineered for bit-perfect, lossless, and hi-res audio playback."
publish_to: "none"

version: 1.2.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Engine
  aqloss_rust_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

  # State
  flutter_riverpod: ^3.3.1

  # Models
  freezed_annotation: ^3.1.0

  # Files
  file_picker: ^12.1.3
  android_file_picker: ^1.0.3
  path: ^1.9.0
  path_provider: ^2.1.3
  open_file: ^4.0.0
  archive: ^4.2.0

  # Network
  http: ^1.6.0
  url_launcher: ^6.3.2

  # Desktop
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  dbus: ^0.7.12
  smtc_windows: ^1.1.0

  # Device
  device_info_plus: ^13.1.0
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5

  # Interface
  cupertino_icons: ^1.0.8
  liquid_glass_easy: ^5.1.0

  # Utilities
  crypto: ^3.0.7

dev_dependencies:
  # Test
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.9
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/l10n/
